name: reusable-codeql

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          Comma-separated CodeQL languages to analyze. Leave empty (the default)
          or pass "auto" to detect them from the files tracked at the scanned
          ref: python if any *.py, javascript-typescript if any JS/TS source.
          Anything else (go, java-kotlin, c-cpp, ...) must be passed explicitly.
        type: string
        required: false
        default: ""
      upload:
        description: "Upload SARIF behavior: always | failure-only | never"
        type: string
        required: false
        default: "always"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # The old default was a fixed "python,javascript-typescript", and CodeQL
  # fails the whole run when a requested language has no source files. Any
  # caller without Python (or without JS/TS) crashed unless it overrode
  # `languages`. Detect instead, from the checked-out tree so a pull request
  # is judged by its own files rather than the default branch's.
  detect:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - name: Checkout
        if: ${{ inputs.languages == '' || inputs.languages == 'auto' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Pick languages
        id: pick
        env:
          REQUESTED: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "auto" ]; then
            # Explicit list: pass through untouched (backward compatible).
            langs="$REQUESTED"
          else
            found=()
            if git ls-files -- '*.py' '*.pyi' | grep -q .; then
              found+=(python)
            fi
            if git ls-files -- '*.js' '*.jsx' '*.mjs' '*.cjs' \
                 '*.ts' '*.tsx' '*.mts' '*.cts' '*.vue' '*.svelte' | grep -q .; then
              found+=(javascript-typescript)
            fi
            langs=$(IFS=,; echo "${found[*]:-}")
            if [ -z "$langs" ]; then
              echo "::notice::No Python or JavaScript/TypeScript sources found; skipping CodeQL. Pass 'languages:' to scan anything else."
            fi
          fi
          echo "CodeQL languages: ${langs:-<none>}"
          echo "languages=$langs" >> "$GITHUB_OUTPUT"

  codeql:
    needs: detect
    if: ${{ needs.detect.outputs.languages != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@45580472a5bb82c4681c4ac726cfdb60060c2ee1
        with:
          languages: ${{ needs.detect.outputs.languages }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@45580472a5bb82c4681c4ac726cfdb60060c2ee1

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@45580472a5bb82c4681c4ac726cfdb60060c2ee1
        with:
          upload: ${{ inputs.upload }}

      # Code scanning cannot be enabled on a private personal-account repo, so
      # those callers pass `upload: never`. Without the two steps below the
      # findings would then exist nowhere: a green run would show only that the
      # queries ran. Keep the SARIF as a run artifact and put the count in the
      # job summary.
      - name: Summarize findings
        if: inputs.upload != 'always'
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          UPLOAD_MODE: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          total=0
          for f in "${SARIF_DIR}"/*.sarif; do
            [ -e "$f" ] || continue
            n=$(jq '[.runs[].results | length] | add // 0' "$f")
            echo "$(basename "$f"): ${n} finding(s)"
            total=$((total + n))
          done
          {
            echo "### CodeQL: ${total} finding(s)"
            echo "SARIF was not uploaded to code scanning (upload: ${UPLOAD_MODE}). Download the codeql-sarif artifact from this run for details."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 0 ]; then
            echo "::warning title=CodeQL findings::${total} finding(s). See the codeql-sarif artifact."
          fi

      - name: Keep SARIF as an artifact
        if: inputs.upload != 'always'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}/*.sarif
          if-no-files-found: error
          retention-days: 30
