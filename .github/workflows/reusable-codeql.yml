name: reusable-codeql

on:
  workflow_call:
    inputs:
      languages:
        description: "Comma-separated CodeQL languages to analyze"
        type: string
        required: false
        default: "python,javascript-typescript"
      upload:
        description: "Upload SARIF behavior: always | failure-only | never"
        type: string
        required: false
        default: "always"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@45580472a5bb82c4681c4ac726cfdb60060c2ee1
        with:
          languages: ${{ inputs.languages }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@45580472a5bb82c4681c4ac726cfdb60060c2ee1

      - name: Analyze
        uses: github/codeql-action/analyze@45580472a5bb82c4681c4ac726cfdb60060c2ee1
        with:
          upload: ${{ inputs.upload }}
