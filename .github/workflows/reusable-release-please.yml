name: reusable-release-please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false
        description: >-
          A user PAT (contents: write, pull-requests: write). Optional, but
          without it release PRs can never merge -- see the comment on the
          "Run Release Please" step below.

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Detect release strategy
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          strategy=""

          if [ -f package.json ]; then
            strategy="node"
          elif [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ] || [ -f requirements.txt ]; then
            strategy="python"
          elif [ -f go.mod ]; then
            strategy="go"
          elif [ -f Cargo.toml ]; then
            strategy="rust"
          fi

          if [ -n "$strategy" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "release_type=$strategy" >> "$GITHUB_OUTPUT"
            echo "Using release strategy: $strategy"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "No supported release strategy detected; skipping."
          fi

      # Prefer a user PAT; fall back to GITHUB_TOKEN so a repo that has not
      # set the secret still cuts releases.
      #
      # GitHub does not trigger workflows for events raised by GITHUB_TOKEN.
      # That anti-recursion rule is why every release PR this action opened
      # sat permanently BLOCKED: the repo's required checks never ran on it,
      # so they could never report, so the PR could never merge, however
      # green the branch was. `skills#44` is the worked example -- CodeQL
      # reported (it comes from default setup, outside the rule) while
      # "Test (Node 20, ubuntu-latest)" and "Validate Plugin" never fired at
      # all. Nothing about it looks like a permissions problem from the PR
      # page; the checks are simply absent.
      #
      # A PAT makes the PR come from a real user, so the workflows trigger.
      - name: Run Release Please
        if: steps.detect.outputs.supported == 'true'
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: ${{ steps.detect.outputs.release_type }}

      - name: Skip release
        if: steps.detect.outputs.supported != 'true'
        run: 'echo "Release Please skipped: no supported strategy."'
